<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encode text to visual and audio barcode</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>

<h1>Audio Barcode Generator</h1>

<p>
    Enter a message and see it encoded into both visual and audio barcode form
</p>

<textarea id="inputText" placeholder="Enter message here!"></textarea>
<br>

<button onclick="generateBarcode()">Encode Message</button>
<button onclick="playBarcode()">Play Audio</button>
<button onclick="stopBarcode()">Stop</button>

<div id="status"></div>

<div id="barcode"></div>

<script src="script.js"></script>

</body>
</html>
